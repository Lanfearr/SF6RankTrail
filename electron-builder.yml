appId: com.sf6scorer.app
productName: SF6 Scorer
asar: true
compression: normal
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraMetadata:
  main: ./out/main/index.js
win:
  target:
    - nsis
  artifactName: SF6-Scorer-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish: null
